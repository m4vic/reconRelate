[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reconrelate"
version = "0.1.0"
description = "CLI-first reconnaissance relationship mapper"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
  {name = "ReconRelate Team"}
]
dependencies = [
  "python-whois>=0.9.5,<0.11",
  "duckduckgo-search>=6.2.13,<9",
  "litellm>=1.83.0,<2",
  "pydantic>=2.9.0,<3",
  "aiohttp>=3.9,<4",
  "rich>=13.7,<15",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0.3",
  "pip-audit>=2.7",
]

[project.scripts]
reconrelate = "reconrelate.cli.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
reconrelate = ["db/schema.sql", "db/migrations/*.sql"]

[tool.setuptools.packages.find]
where = ["src"]
